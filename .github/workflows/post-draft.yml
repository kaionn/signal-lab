name: Post Draft

on:
  push:
    branches: [main]
    paths:
      - "experiments/**/meta.yaml"
  workflow_dispatch:
    inputs:
      slug:
        description: "対象 Probe の slug"
        required: true
        type: string

permissions:
  contents: write

# Safe default retains Discord. Enable only after bot installation and channel verification.
env:
  NOTIFICATION_MODE: ${{ vars.NOTIFICATION_MODE || 'discord' }}
  NOTIFY_DURABLE_LEDGER: ${{ vars.NOTIFY_DURABLE_LEDGER || 'false' }}
  SLACK_ALERT_CHANNEL_ID: ${{ vars.SLACK_ALERT_CHANNEL_ID }}
  SLACK_REPORT_CHANNEL_ID: ${{ vars.SLACK_REPORT_CHANNEL_ID }}

jobs:
  post-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Resolve target slugs
        id: slugs
        env:
          DISPATCH_SLUG: ${{ github.event.inputs.slug }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_SLUG:-}" ]; then
            echo "slugs=$DISPATCH_SLUG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SLUGS=$(git diff --name-only HEAD^ HEAD | grep -E '^experiments/.*/meta\.yaml$' \
            | sed -E 's#^experiments/([^/]+)/meta\.yaml$#\1#' \
            | grep -v '^_' \
            | sort -u \
            | tr '\n' ' ' || true)

          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "resolved slugs: $SLUGS"

      - name: Install Claude Code
        if: steps.slugs.outputs.slugs != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate and post drafts
        if: steps.slugs.outputs.slugs != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTIFY_LEDGER_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLUGS: ${{ steps.slugs.outputs.slugs }}
        run: |
          set -euo pipefail
          for SLUG in $SLUGS; do
            echo "::group::$SLUG"

            # live 以外（killed / draft / graduated）は post-draft.mjs でも skip されるが、
            # そこへ到達する前のデプロイ待ち最大 5 分と playwright インストールが空振りするため先に落とす
            STATUS=$(SLUG="$SLUG" node -p "require('yaml').parse(require('fs').readFileSync('experiments/' + process.env.SLUG + '/meta.yaml', 'utf-8'))?.status ?? ''" 2>/dev/null || echo "")
            if [ "$STATUS" != "live" ]; then
              echo "skip $SLUG (status=${STATUS:-unreadable})"
              echo "::endgroup::"
              continue
            fi

            URL="https://signal-lab-six.vercel.app/p/$SLUG"
            SCREENSHOT="/tmp/probe-shot-$SLUG.png"

            READY=0
            for i in $(seq 1 20); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
              if [ "$STATUS" = "200" ]; then
                READY=1
                break
              fi
              echo "waiting for deploy ($SLUG): status=$STATUS (attempt $i)"
              sleep 15
            done

            if [ "$READY" = "1" ]; then
              npm i --no-save playwright
              npx playwright install --with-deps chromium
              node scripts/probe-screenshot.mjs "$URL" "$SCREENSHOT" || echo "::warning::screenshot failed for $SLUG"
            else
              echo "::warning::deploy not ready in time for $SLUG, skipping screenshot"
            fi

            # 手動 dispatch は再生成の意図なので distribution 済みガードを外す
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              node scripts/post-draft.mjs "$SLUG" --force
            else
              node scripts/post-draft.mjs "$SLUG"
            fi
            echo "::endgroup::"
          done

      - name: Preserve notification delivery receipts and sanitized recovery outbox
        if: ${{ always() && (env.NOTIFICATION_MODE == 'shadow' || env.NOTIFICATION_MODE == 'slack') }}
        uses: actions/upload-artifact@v4
        with:
          name: slack-delivery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            .notification-state/*.json
            .notification-outbox/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

      - name: Audit primary notification completion after business work
        if: ${{ always() && env.NOTIFICATION_MODE == 'slack' }}
        run: python3 scripts/notify_bridge.py --audit
