name: Weekly Digest

on:
  schedule:
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discord 送信 / Issue 起票をせず判定結果のみ出力する"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Slack-only default. Explicit discord/shadow values are retained for rollback.
env:
  NOTIFICATION_MODE: ${{ vars.NOTIFICATION_MODE || 'slack' }}
  NOTIFY_DURABLE_LEDGER: ${{ vars.NOTIFY_DURABLE_LEDGER || 'false' }}
  SLACK_ALERT_CHANNEL_ID: ${{ vars.SLACK_ALERT_CHANNEL_ID }}
  SLACK_REPORT_CHANNEL_ID: ${{ vars.SLACK_REPORT_CHANNEL_ID }}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: node scripts/weekly-digest.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTIFY_LEDGER_TOKEN: ${{ github.token }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ (vars.NOTIFICATION_MODE == 'discord' || vars.NOTIFICATION_MODE == 'shadow') && secrets.DISCORD_WEBHOOK_URL || '' }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}

      - name: Preserve notification delivery receipts and sanitized recovery outbox
        if: ${{ always() && (env.NOTIFICATION_MODE == 'shadow' || env.NOTIFICATION_MODE == 'slack') }}
        uses: actions/upload-artifact@v4
        with:
          name: slack-delivery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            .notification-state/*.json
            .notification-outbox/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

      - name: Audit primary notification completion after business work
        if: ${{ always() && env.NOTIFICATION_MODE == 'slack' }}
        run: python3 scripts/notify_bridge.py --audit
